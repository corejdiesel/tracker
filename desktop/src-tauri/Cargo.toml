[package]
name = "freelance-os-desktop"
version = "0.1.0"
description = "Freelance OS — local-first desktop shell"
edition = "2021"
rust-version = "1.77"

[lib]
name = "freelance_os_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
# Native credential storage: Keychain on macOS, Credential Manager on
# Windows, Secret Service on Linux — one API, OS-appropriate backend.
# Keychain behaviour is UNVERIFIED here (no macOS in this container); see
# docs/desktop-architecture.md §3.
keyring = "3"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
